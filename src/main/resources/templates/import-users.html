<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Import Readers via Excel — FLMS FPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { fpt: { orange: '#F27125', dark: '#0F172A' } } } } }
    </script>
</head>
<body class="bg-[#0b0f19] min-h-screen text-slate-100 flex flex-col justify-center items-center p-4">

    <div class="w-full max-w-lg bg-slate-900/60 border border-slate-800 backdrop-blur-xl rounded-2xl p-8 shadow-2xl">
        <h2 class="text-xl font-bold text-slate-200 mb-2">IMPORT DANH SÁCH BẠN ĐỌC</h2>
        <p class="text-xs text-slate-400 mb-6">Hệ thống chấp nhận file Excel (.xlsx) chứa các cột: Mã số, Họ tên, Email, Campus ID</p>

        <div th:if="${successMessage != null}" class="mb-4 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 px-4 py-3 rounded-xl text-xs font-medium" th:text="${successMessage}"></div>
        <div th:if="${errorMessage != null}" class="mb-4 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-xs font-medium" th:text="${errorMessage}"></div>

        <form th:action="@{/admin/import-users}" method="POST" enctype="multipart/form-data" class="space-y-5">
            <div class="border-2 border-dashed border-slate-700 hover:border-fpt-orange/50 rounded-xl p-6 text-center cursor-pointer transition-all bg-slate-950/40">
                <input type="file" name="file" accept=".xlsx" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-fpt-orange file:text-white hover:file:bg-orange-600 cursor-pointer"/>
            </div>
            
            <div class="flex gap-3">
                <button type="submit" class="w-full bg-fpt-orange hover:bg-orange-600 text-white py-3 rounded-xl font-bold transition-all text-sm shadow-lg shadow-fpt-orange/20">
                    Bắt đầu Import
                </button>
                <a href="/login" class="w-1/3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-center py-3 rounded-xl font-medium text-sm border border-slate-700">
                    Về Login
                </a>
            </div>
        </form>
    </div>

</body>
</html>
