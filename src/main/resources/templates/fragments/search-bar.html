<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Fragment: search-form -->
<form th:fragment="search-form" th:action="${searchAction != null ? searchAction : '/books'}" method="get" id="search-form"
      class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-2xl p-4 shadow-2xl w-full max-w-4xl mx-auto text-left">

    <!-- Keyword row -->
    <div class="flex items-center bg-white rounded-xl px-4 py-3 mb-3 shadow-inner">
        <svg class="w-5 h-5 text-slate-400 shrink-0 mr-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <input id="keyword" name="keyword" type="text"
               th:value="${keyword}"
               placeholder="Nhập tiêu đề, tên tác giả hoặc ISBN..."
               class="search-input w-full bg-transparent text-slate-800 font-medium focus:outline-none placeholder-slate-400 text-sm">
        <button type="button" onclick="document.getElementById('keyword').value=''"
                class="text-slate-400 hover:text-slate-600 ml-2 text-lg leading-none">&times;</button>
    </div>

    <!-- Filter row -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
        <!-- Campus dropdown -->
        <div class="flex items-center bg-white/90 text-slate-700 rounded-xl px-4 py-2.5">
            <svg class="w-4 h-4 text-fpt-orange shrink-0 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <select id="campusId" name="campusId" class="w-full bg-transparent text-sm font-medium focus:outline-none cursor-pointer min-w-0">
                <option value="">Tất cả cơ sở</option>
                <option th:each="campus : ${campuses}"
                        th:value="${campus.campusId}"
                        th:text="${campus.campusName}"
                        th:selected="${campus != null and selectedCampusId != null and campus.campusId == selectedCampusId}">Campus</option>
            </select>
        </div>

        <!-- Major dropdown -->
        <div class="flex items-center bg-white/90 text-slate-700 rounded-xl px-4 py-2.5">
            <svg class="w-4 h-4 text-fpt-orange shrink-0 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
            </svg>
            <select id="majorId" name="majorId" class="w-full bg-transparent text-sm font-medium focus:outline-none cursor-pointer min-w-0">
                <option value="">Tất cả chuyên ngành</option>
                <option value="-1" th:selected="${selectedMajorId != null and selectedMajorId == -1}">Sách ngoài chuyên ngành</option>
                <option th:each="major : ${majors}"
                        th:value="${major.majorId}"
                        th:text="${major.majorName}"
                        th:selected="${major != null and selectedMajorId != null and major.majorId == selectedMajorId}">Major</option>
            </select>
        </div>

        <!-- Subject dropdown -->
        <div class="flex items-center bg-white/90 text-slate-700 rounded-xl px-4 py-2.5">
            <svg class="w-4 h-4 text-fpt-orange shrink-0 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            <select id="subjectCode" name="subjectCode" class="w-full bg-transparent text-sm font-medium focus:outline-none cursor-pointer min-w-0">
                <option value="">Tất cả môn học</option>
                <option th:each="subj : ${subjects}"
                        th:value="${subj.subjectCode}"
                        th:text="${subj.subjectCode} + ' - ' + ${subj.subjectName}"
                        th:selected="${subj != null and selectedSubjectCode != null and subj.subjectCode == selectedSubjectCode}">Subject</option>
            </select>
        </div>

        <!-- Category dropdown -->
        <div class="flex items-center bg-white/90 text-slate-700 rounded-xl px-4 py-2.5">
            <svg class="w-4 h-4 text-fpt-orange shrink-0 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
            <select id="categoryId" name="categoryId" class="w-full bg-transparent text-sm font-medium focus:outline-none cursor-pointer min-w-0">
                <option value="">Tất cả thể loại</option>
                <option th:each="category : ${categories}"
                        th:value="${category.categoryId}"
                        th:text="${category.categoryName}"
                        th:selected="${category != null and selectedCategoryId != null and category.categoryId == selectedCategoryId}">Category</option>
            </select>
        </div>

        <!-- Search button -->
        <button type="submit" id="search-btn"
                class="bg-fpt-orange hover:bg-fpt-orangeHover text-white py-2.5 px-6 rounded-xl font-bold transition-all text-sm shadow-lg shadow-orange-500/30 flex items-center justify-center space-x-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <span>Tìm kiếm</span>
        </button>
    </div>

    <!-- Active filter chips -->
    <div th:if="${hasSearch}" class="flex flex-wrap gap-2 mt-3">
        <span th:if="${#strings.length(keyword ?: '') > 0}"
              class="inline-flex items-center bg-orange-500/20 text-orange-200 text-xs font-medium px-3 py-1 rounded-full">
            <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 3a1 1 0 012 0v5.5a.5.5 0 001 0V4a1 1 0 112 0v4.5a.5.5 0 001 0V6a1 1 0 112 0v5a7 7 0 11-14 0V9a1 1 0 012 0v2.5a.5.5 0 001 0V4a1 1 0 012 0v4.5a.5.5 0 001 0V3z" clip-rule="evenodd"/></svg>
            Từ khoá: <span th:text="' ' + ${keyword}" class="ml-1 font-semibold"></span>
        </span>
        <span th:if="${selectedSubjectCode != null and !#strings.isEmpty(selectedSubjectCode)}"
              class="inline-flex items-center bg-blue-500/20 text-blue-200 text-xs font-medium px-3 py-1 rounded-full">
            Môn học: <span th:text="' ' + ${selectedSubjectCode}" class="ml-1 font-semibold"></span>
        </span>
    </div>
</form>

</body>
</html>
