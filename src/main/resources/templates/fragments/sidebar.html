<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ SIDEBAR FRAGMENT ══ -->
<aside th:fragment="sidebar(activeItem)" class="w-full lg:w-64 flex-shrink-0">
    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-lg sticky top-24">
        <!-- User Profile Summary in Sidebar -->
        <div class="p-6 border-b border-slate-200 flex flex-col items-center text-center">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center text-2xl font-bold text-fpt-orange mb-3 shadow-inner border border-slate-200" 
                 th:if="${session.loggedInUser != null}"
                 th:text="${#strings.substring(session.loggedInUser.fullName, 0, 1)}">
            </div>
            <h3 class="font-bold text-slate-800" th:if="${session.loggedInUser != null}" th:text="${session.loggedInUser.fullName}">Tên Người Dùng</h3>
            <p class="text-xs text-slate-500 mt-1 font-mono" th:if="${session.loggedInUser != null}" th:text="${session.loggedInUser.userId}">ID</p>
        </div>
        
        <!-- Navigation Links -->
        <div class="p-3 space-y-1 max-h-[60vh] overflow-y-auto">
            <p class="px-4 pt-3 pb-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Thông tin chung</p>
            <a href="/profile" 
               class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
               th:classappend="${activeItem == 'profile'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span>Hồ sơ của tôi</span>
            </a>
            <a href="/reservations" 
               class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
               th:classappend="${activeItem == 'reservations'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>Yêu cầu đặt mượn</span>
            </a>
            <a href="/borrowing-history" 
               class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
               th:classappend="${activeItem == 'history'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span>Lịch sử mượn trả</span>
            </a>

            <!-- Portals Links -->
            <div th:if="${session.isLibrarian == true or session.isAdmin == true}" class="mt-4 pt-4 border-t border-slate-100">
                <a th:if="${session.isLibrarian == true}" href="/librarian/inventory/dashboard" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors text-fpt-orange bg-orange-50 hover:bg-orange-100 font-medium mb-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <span>Vào Bảng Điều Khiển Thủ Thư</span>
                </a>
                <a th:if="${session.isAdmin == true}" href="/admin/students" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors text-rose-600 bg-rose-50 hover:bg-rose-100 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Vào Bảng Điều Khiển Admin</span>
                </a>
            </div>
        </div>
    </div>
</aside>

</body>
</html>
