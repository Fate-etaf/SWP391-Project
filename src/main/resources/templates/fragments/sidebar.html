<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ SIDEBAR FRAGMENT ══ -->
<aside th:fragment="sidebar(activeItem)" class="w-full lg:w-64 flex-shrink-0">
    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-lg sticky top-24">
        <!-- User Profile Summary in Sidebar -->
        <div class="p-6 border-b border-slate-200 flex flex-col items-center text-center">
            <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center text-2xl font-bold text-fpt-orange mb-3 shadow-inner border border-slate-200" 
                 th:if="${session.loggedInUser != null}"
                 th:text="${#strings.substring(session.loggedInUser.fullName, 0, 1)}">
            </div>
            <h3 class="font-bold text-slate-800" th:if="${session.loggedInUser != null}" th:text="${session.loggedInUser.fullName}">Tên Người Dùng</h3>
            <p class="text-xs text-slate-500 mt-1 font-mono" th:if="${session.loggedInUser != null}" th:text="${session.loggedInUser.userId}">ID</p>
        </div>
        
        <!-- Navigation Links -->
        <div class="p-3 space-y-1">
            <p class="px-4 pt-3 pb-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Thông tin chung</p>
            <a href="/profile" 
               class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
               th:classappend="${activeItem == 'profile'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span>Hồ sơ của tôi</span>
            </a>
            <a href="/reservations" 
               class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
               th:classappend="${activeItem == 'reservations'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>Yêu cầu đặt mượn</span>
            </a>
            <a href="/borrowing-history" 
               class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
               th:classappend="${activeItem == 'history'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-800'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                <span>Lịch sử mượn trả</span>
            </a>

            <!-- Librarian/Admin Exclusive Links -->
            <div th:if="${session.isLibrarian == true or session.isAdmin == true}">
                <p class="px-4 pt-5 pb-2 text-[10px] font-bold text-orange-500/80 uppercase tracking-wider">Khu vực Quản trị</p>
                <a href="/librarian/inventory/dashboard" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
                   th:classappend="${activeItem == 'acquisitionDashboard'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-orange-50 hover:text-fpt-orange'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                    <span>Dashboard Quản lý</span>
                </a>
                <a href="/librarian/acquisition/dashboard" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
                   th:classappend="${activeItem == 'acquisition'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-orange-50 hover:text-fpt-orange'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                    <span>Danh sách đề nghị tài liệu</span>
                </a>
                <a href="/librarian/inventory/list" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
                   th:classappend="${activeItem == 'list'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-orange-50 hover:text-fpt-orange'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    <span>Danh mục Sách</span>
                </a>
                <a href="/librarian/inventory/transfers" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
                   th:classappend="${activeItem == 'transfers'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-orange-50 hover:text-fpt-orange'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"></path></svg>
                    <span>Luân chuyển sách</span>
                </a>
                <a href="/librarian/reports" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
                   th:classappend="${activeItem == 'reports'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-orange-50 hover:text-fpt-orange'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-6m4 6V7m4 10v-4M5 21h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    <span>Báo cáo Hoạt động</span>
                </a>
                <a href="/librarian/create-loan" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
                   th:classappend="${activeItem == 'create-loan'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-orange-50 hover:text-fpt-orange'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                    <span>Tạo Đơn Mượn</span>
                </a>
                <a href="/violations/overdue" 
                   class="flex items-center space-x-3 px-4 py-2.5 rounded-xl transition-colors"
                   th:classappend="${activeItem == 'overdue'} ? 'bg-orange-50 text-fpt-orange font-semibold' : 'text-slate-500 hover:bg-orange-50 hover:text-fpt-orange'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span>Sách Quá Hạn</span>
                </a>
            </div>
        </div>
    </div>
</aside>

</body>
</html>
