<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu — FLMS FPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fpt: {
                            orange: '#F27125',
                            navy: '#1E293B',
                            dark: '#0F172A',
                            orangeHover: '#D95F18'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0f19] min-h-screen text-slate-100 flex flex-col justify-center items-center relative overflow-hidden p-4">
    
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-fpt-orange/10 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-orange-500/10 rounded-full blur-[100px] pointer-events-none"></div>
    
    <!-- Nút Home / Quay lại Đăng nhập -->
    <a href="/login" class="absolute top-6 left-6 flex items-center text-slate-400 hover:text-fpt-orange transition-colors z-50 group">
        <div class="bg-slate-800/50 p-2 rounded-full mr-2 group-hover:bg-fpt-orange/20 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
        </div>
        <span class="font-medium text-sm">Quay lại Đăng nhập</span>
    </a>
    
    <div class="flex items-center space-x-3 mb-8 relative z-10">
        <div class="bg-fpt-orange text-white px-3 py-1.5 rounded-xl font-extrabold text-2xl tracking-wider shadow-lg shadow-fpt-orange/20">
            FPT
        </div>
        <div>
            <h1 class="text-xl font-extrabold tracking-tight leading-none text-orange-400">FLMS</h1>
            <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider mt-0.5">Password Recovery</p>
        </div>
    </div>

    <div class="w-full max-w-md bg-slate-900/60 border border-slate-800 backdrop-blur-xl rounded-2xl p-6 shadow-2xl relative z-10 transition-all hover:border-fpt-orange/30 text-center">
        
        <h2 class="text-xl font-bold text-slate-200 mb-2">QUÊN MẬT KHẨU?</h2>
        <p class="text-[11px] text-slate-400 mb-6">Vui lòng nhập Email tổ chức của bạn để nhận mã xác thực (OTP) khôi phục mật khẩu.</p>

        <div id="alert-box" class="hidden mb-4 px-4 py-3 rounded-xl text-xs font-medium text-left items-start gap-2 relative z-20 animate-fade-in"></div>

        <form id="forgot-password-form" class="space-y-3 mb-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Địa chỉ Email</label>
                <div class="relative flex items-center">
                    <svg class="w-4 h-4 text-slate-500 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <input type="email" id="emailInput" placeholder="username@fpt.edu.vn" required autocomplete="off"
                           class="w-full bg-slate-950 border border-slate-800 text-slate-200 pl-11 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:border-fpt-orange focus:ring-2 focus:ring-fpt-orange/20 transition-all placeholder-slate-600">
                </div>
            </div>

            <!-- Nút gửi OTP -->
            <button type="button" id="btn-send-otp" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 hover:border-slate-600 py-3 rounded-xl font-bold transition-all text-sm disabled:opacity-50 mt-2">
                Gửi mã xác nhận (OTP)
            </button>
            
            <div id="reset-password-section" class="hidden space-y-4 pt-4 border-t border-slate-800 mt-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Mã OTP</label>
                    <div class="relative flex items-center">
                        <input type="text" id="otpCode" placeholder="Nhập mã 6 số" required autocomplete="off"
                               class="w-full bg-slate-950 border border-slate-800 text-slate-200 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-fpt-orange focus:ring-2 focus:ring-fpt-orange/20 transition-all placeholder-slate-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Mật khẩu mới</label>
                    <div class="relative flex items-center">
                        <svg class="w-4 h-4 text-slate-500 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <input type="password" id="newPassword" placeholder="••••••••" required autocomplete="off"
                               class="w-full bg-slate-950 border border-slate-800 text-slate-200 pl-11 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:border-fpt-orange focus:ring-2 focus:ring-fpt-orange/20 transition-all placeholder-slate-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Xác nhận mật khẩu mới</label>
                    <div class="relative flex items-center">
                        <svg class="w-4 h-4 text-slate-500 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                        <input type="password" id="confirmPassword" placeholder="••••••••" required autocomplete="off"
                               class="w-full bg-slate-950 border border-slate-800 text-slate-200 pl-11 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:border-fpt-orange focus:ring-2 focus:ring-fpt-orange/20 transition-all placeholder-slate-600">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-fpt-orange hover:bg-fpt-orangeHover text-white py-3 rounded-xl font-bold transition-all text-sm shadow-lg shadow-fpt-orange/20 active:scale-[0.99] mt-4">
                    Khôi phục mật khẩu
                </button>
            </div>

        </form>
    </div>

    <div class="text-center text-[11px] text-slate-600 mt-8 relative z-10">
        <p>&copy; 2026 FPT University Library System. Developed by Team 5 SWP391.</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const btnSendOtp = document.getElementById("btn-send-otp");
            const resetPasswordSection = document.getElementById("reset-password-section");
            const alertBox = document.getElementById("alert-box");
            const form = document.getElementById("forgot-password-form");
            const emailInput = document.getElementById("emailInput");

            function showAlert(msg, isSuccess) {
                alertBox.innerHTML = `<span>${isSuccess ? '✅' : '❌'}</span><span>${msg}</span>`;
                alertBox.className = `mb-6 px-4 py-3 rounded-xl text-xs font-medium text-left flex items-start gap-2 relative z-20 animate-fade-in block ${isSuccess ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-400' : 'bg-red-500/10 border border-red-500/30 text-red-400'}`;
            }

            btnSendOtp.addEventListener("click", function() {
                const email = emailInput.value.trim();
                if (!email) {
                    showAlert("Vui lòng nhập địa chỉ Email.", false);
                    return;
                }

                btnSendOtp.disabled = true;
                btnSendOtp.innerText = "Đang gửi...";
                
                fetch("/api/auth/forgot-password/send-otp", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: "email=" + encodeURIComponent(email)
                })
                .then(response => {
                    if (response.ok) return response.text();
                    else return response.text().then(text => { throw new Error(text) });
                })
                .then(msg => {
                    showAlert(msg, true);
                    resetPasswordSection.classList.remove("hidden");
                    let countdown = 60;
                    const timer = setInterval(() => {
                        countdown--;
                        btnSendOtp.innerText = `Thử lại sau ${countdown}s`;
                        if (countdown <= 0) {
                            clearInterval(timer);
                            btnSendOtp.disabled = false;
                            btnSendOtp.innerText = "Gửi lại OTP";
                        }
                    }, 1000);
                })
                .catch(err => {
                    btnSendOtp.disabled = false;
                    btnSendOtp.innerText = "Gửi mã xác nhận (OTP)";
                    showAlert(err.message || "Lỗi kết nối hoặc email chưa được cấu hình", false);
                });
            });

            form.addEventListener("submit", function(e) {
                e.preventDefault();
                const newPassword = document.getElementById("newPassword").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const otp = document.getElementById("otpCode").value;
                const email = emailInput.value.trim();

                if (newPassword !== confirmPassword) {
                    showAlert("Mật khẩu xác nhận không khớp!", false);
                    return;
                }

                fetch("/api/auth/forgot-password/reset", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        newPassword: newPassword,
                        confirmPassword: confirmPassword,
                        otp: otp
                    })
                })
                .then(async response => {
                    const msg = await response.text();
                    if (response.ok) {
                        showAlert(msg, true);
                        form.reset();
                        resetPasswordSection.classList.add("hidden");
                        setTimeout(() => window.location.href = "/login", 2000);
                    } else {
                        showAlert(msg, false);
                    }
                })
                .catch(err => showAlert("Đã xảy ra lỗi kết nối", false));
            });
        });
    </script>
</body>
</html>
