<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Phòng Học Nhóm — Cổng Quản Trị</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { fpt: { orange: '#F27125', navy: '#1E293B', dark: '#0F172A', orangeHover: '#D95F18' } } } }
        }
    </script>
    

    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 flex flex-col justify-between relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-fpt-orange/10 rounded-full blur-[100px]"></div>
        <div class="absolute top-1/2 right-0 w-96 h-96 bg-blue-500/10 rounded-full blur-[100px]"></div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 relative z-10 flex flex-col lg:flex-row gap-8">
        
        <div th:replace="~{fragments/librarian_sidebar :: sidebar('study-rooms-management')}"></div>

        <div class="flex-grow min-w-0 bg-white border border-slate-200 rounded-2xl p-6 shadow-xl">
            
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 pb-5 border-b border-slate-200">
                <div>
                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">QUẢN LÝ PHÒNG HỌC NHÓM</h1>
                    <p class="text-xs text-slate-500 mt-1">Theo dõi, Check-in, và Hủy phòng cho sinh viên cơ sở của bạn.</p>
                </div>
                
                <!-- <a href="/librarian/study-room-scanner" target="_blank"
                   class="inline-flex items-center justify-center gap-2 bg-fpt-orange hover:bg-fpt-orangeHover text-white font-bold px-4 py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-fpt-orange/20 active:scale-[0.98]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                    </svg>
                    <span>Mở QR Scanner</span>
                </a> -->
            </div>

            <form method="GET" action="/librarian/study-rooms/management" class="flex flex-col sm:flex-row gap-3 mb-6 relative z-20">
                <div class="flex-grow relative">
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Chọn ngày</label>
                    <input type="date" name="date" th:value="${targetDate}" onchange="this.form.submit()"
                           class="w-full sm:w-64 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-700 focus:outline-none focus:border-fpt-orange transition-all"/>
                </div>
            </form>

            <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm relative z-10">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-xs uppercase font-semibold text-slate-500 border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-4">Tên Phòng</th>
                                <th class="px-6 py-4">Giờ đặt</th>
                                <th class="px-6 py-4">Số lượng</th>
                                <th class="px-6 py-4 text-center">Trạng thái</th>
                                <th class="px-6 py-4 text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr th:if="${bookings.isEmpty()}" class="hover:bg-slate-50 transition-colors">
                                <td colspan="5" class="px-6 py-8 text-center text-slate-500 italic">
                                    Không có đơn đặt phòng nào trong ngày này.
                                </td>
                            </tr>
                            <tr th:each="b : ${bookings}" class="hover:bg-slate-50 transition-colors group">
                                <td class="px-6 py-4 font-bold text-slate-700">
                                    <span th:text="${b.roomName}">Phòng 1</span>
                                    <div class="text-[10px] text-slate-400 font-normal mt-1">ID: <span th:text="${b.bookingId}"></span></div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-slate-900 font-semibold" th:text="${b.startTime + ' - ' + b.endTime}"></div>
                                </td>
                                <td class="px-6 py-4" th:text="${b.participantCount + ' người'}">3 người</td>
                                <td class="px-6 py-4 text-center">
                                    <span th:if="${b.status == 'Confirmed'}" class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-3 py-1 rounded-full text-xs font-bold">Chờ sử dụng</span>
                                    <span th:if="${b.status == 'CheckedIn'}" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold">Đang sử dụng</span>
                                    <span th:if="${b.status == 'CheckedOut'}" class="bg-slate-500/10 text-slate-400 border border-slate-500/20 px-3 py-1 rounded-full text-xs font-bold">Đã trả phòng</span>
                                    <span th:if="${b.status == 'NoShow'}" class="bg-fpt-orange/10 text-fpt-orange border border-fpt-orange/20 px-3 py-1 rounded-full text-xs font-bold">No-show</span>
                                    <span th:if="${b.status == 'Cancelled'}" class="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-3 py-1 rounded-full text-xs font-bold">Đã hủy</span>
                                    <span th:if="${b.status == 'Evicted'}" class="bg-red-500/10 text-red-500 border border-red-500/20 px-3 py-1 rounded-full text-xs font-bold uppercase">Vi phạm</span>
                                </td>
                                <td class="px-6 py-4 text-center space-x-2 flex justify-center items-center h-full min-h-[50px]">
                                    <button th:if="${b.status == 'Confirmed'}" th:onclick="'changeStatus(' + ${b.bookingId} + ', \'checkin\')'" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg transition-colors font-semibold">Check-in</button>
                                    <button th:if="${b.status == 'Confirmed'}" th:onclick="'if(confirm(\'Hủy đơn đặt phòng này?\')) changeStatus(' + ${b.bookingId} + ', \'librarian-cancel\')'" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg transition-colors font-semibold">Hủy</button>
                                    
                                    <button th:if="${b.status == 'CheckedIn'}" th:onclick="'changeStatus(' + ${b.bookingId} + ', \'checkout\')'" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg transition-colors font-semibold">Check-out</button>
                                    <button th:if="${b.status == 'CheckedIn'}" th:onclick="'if(confirm(\'Xác nhận đánh dấu vi phạm nội quy và mời nhóm này ra ngoài?\')) changeStatus(' + ${b.bookingId} + ', \'evict\')'" class="text-xs bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-lg transition-colors font-semibold">Mời ra</button>
                                    <span th:if="${b.status != 'Confirmed' && b.status != 'CheckedIn'}" class="text-xs text-slate-600">-</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        function changeStatus(bookingId, action) {
            fetch(`/api/study-rooms/book/${bookingId}/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(res => res.text().then(text => ({status: res.status, text: text})))
            .then(data => {
                if(data.status === 200) {
                    window.location.reload();
                } else {
                    alert('Lỗi: ' + data.text);
                }
            })
            .catch(err => {
                console.error(err);
                alert('Đã có lỗi xảy ra');
            });
        }
    </script>
</body>
</html>
