<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo lệnh luân chuyển - FLMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { fpt: { orange: '#F27125', navy: '#1E293B', dark: '#0F172A', orangeHover: '#D95F18' } } } }
        }
    </script>
    <style th:replace="~{fragments/header :: header-style}"></style>
    <style th:replace="~{fragments/footer :: footer-style}"></style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] min-h-screen text-slate-100 flex flex-col justify-between relative overflow-x-hidden">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-fpt-orange/10 rounded-full blur-[100px]"></div>
        <div class="absolute top-1/2 right-0 w-96 h-96 bg-blue-500/10 rounded-full blur-[100px]"></div>
    </div>

    <div class="relative z-50">
        <div th:replace="~{fragments/header :: header('librarian')}"></div>
    </div>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 relative z-10 flex flex-col lg:flex-row gap-8">
        <div th:replace="~{fragments/sidebar :: sidebar('transfers')}"></div>

        <div class="flex-grow min-w-0 max-w-3xl">
            <div class="mb-6 flex items-center space-x-3">
                <a href="/librarian/inventory/transfers" class="text-slate-500 hover:text-fpt-orange transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                </a>
                <div>
                    <span class="bg-fpt-orange/20 text-orange-400 px-3 py-1 rounded-full text-[10px] font-bold tracking-wide uppercase mb-3 inline-block">New Transfer</span>
                    <h2 class="text-3xl font-extrabold text-white tracking-tight">Tạo lệnh luân chuyển mới</h2>
                    <p class="text-sm text-slate-400 mt-1">Lệnh sẽ chuyển trạng thái các sách này sang "Đang giao hàng" (In Transit).</p>
                </div>
            </div>

            <div class="bg-slate-900/60 border border-slate-800 backdrop-blur-xl rounded-2xl p-6 sm:p-8 shadow-2xl">
                <form action="/librarian/inventory/transfers/create" method="post" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Cơ sở xuất phát <span class="text-rose-400">*</span></label>
                            <select name="fromCampusId" id="fromCampusSelect" required class="w-full bg-[#0e1625] border border-slate-700 text-slate-200 text-sm rounded-xl focus:outline-none focus:border-fpt-orange focus:ring-1 focus:ring-fpt-orange/50 block p-3 transition-colors">
                                <option value="">-- Chọn cơ sở xuất --</option>
                                <option th:each="campus : ${campuses}"
                                        th:value="${campus.campusId}"
                                        th:text="${campus.campusName}"
                                        th:selected="${(param.fromCampusId != null and param.fromCampusId[0] == campus.campusId.toString()) or (param.fromCampusId == null and session.loggedInUser.campusId == campus.campusId)}"></option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Cơ sở nhận sách <span class="text-rose-400">*</span></label>
                            <select name="toCampusId" id="toCampusSelect" required class="w-full bg-[#0e1625] border border-slate-700 text-slate-200 text-sm rounded-xl focus:outline-none focus:border-fpt-orange focus:ring-1 focus:ring-fpt-orange/50 block p-3 transition-colors">
                                <option value="">-- Chọn cơ sở nhận --</option>
                                <option th:each="campus : ${campuses}"
                                        th:value="${campus.campusId}"
                                        th:text="${campus.campusName}"
                                        th:selected="${param.targetCampusId != null and param.targetCampusId[0] == campus.campusId.toString()}"></option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Mã bản sao sách <span class="text-rose-400">*</span></label>
                        <p class="text-xs text-slate-500 mb-2">Nhập các mã Barcode/RFID của sách, cách nhau bằng dấu phẩy.</p>
                        <textarea name="copyIds" rows="4" required th:text="${suggestedCopyIds != null ? suggestedCopyIds : ''}" placeholder="Ví dụ: CP-CC-HN-001, CP-DB-HN-001" class="w-full bg-[#0e1625] border border-slate-700 text-slate-200 text-sm rounded-xl focus:outline-none focus:border-fpt-orange focus:ring-1 focus:ring-fpt-orange/50 block p-3 transition-colors placeholder:text-slate-600"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ghi chú</label>
                        <input type="text" name="note" 
                               th:value="${param.suggestedBookTitle != null ? 'Luân chuyển sách [' + param.suggestedBookTitle[0] + '] theo yêu cầu từ Waitlist.' : ''}"
                               placeholder="Ví dụ: Chuyển gấp theo yêu cầu sinh viên HE170001..." class="w-full bg-[#0e1625] border border-slate-700 text-slate-200 text-sm rounded-xl focus:outline-none focus:border-fpt-orange focus:ring-1 focus:ring-fpt-orange/50 block p-3 transition-colors placeholder:text-slate-600">
                    </div>

                    <div class="pt-4 flex items-center justify-end space-x-4 border-t border-slate-800">
                        <a href="/librarian/inventory/transfers" class="text-sm font-semibold text-slate-400 hover:text-slate-200 px-4 py-2 transition-colors">Hủy bỏ</a>
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition-all shadow-lg shadow-emerald-600/20 border border-emerald-500">
                            Xác nhận luân chuyển
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div class="relative z-10 mt-auto">
        <div th:replace="~{fragments/footer :: footer}"></div>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const campusCopiesMap = /*[[${campusCopiesMap}]]*/ {};
        const copyIdsTextarea = document.querySelector('textarea[name="copyIds"]');
        const fromCampusSelect = document.getElementById('fromCampusSelect');
        const toCampusSelect = document.getElementById('toCampusSelect');

        function updateCopyIds() {
            const selectedCampusId = fromCampusSelect.value;
            if (selectedCampusId && campusCopiesMap && campusCopiesMap[selectedCampusId] && campusCopiesMap[selectedCampusId].length > 0) {
                // Lấy số lượng sinh viên đang chờ từ URL (mặc định là 1 nếu không có)
                const urlParams = new URLSearchParams(window.location.search);
                const waitCount = parseInt(urlParams.get('waitingCount')) || 1;
                
                // Trích xuất số lượng mã sách tương ứng với số sinh viên chờ (tối đa bằng số lượng sách hiện có)
                const maxCopies = Math.min(waitCount, campusCopiesMap[selectedCampusId].length);
                const selectedCopies = campusCopiesMap[selectedCampusId].slice(0, maxCopies);
                
                // Nối các mã sách bằng dấu phẩy
                copyIdsTextarea.value = selectedCopies.join(', ');
            } else {
                // Chỉ clear nếu load từ gợi ý, nếu user tự nhập thì không clear
                if (campusCopiesMap && Object.keys(campusCopiesMap).length > 0) {
                    copyIdsTextarea.value = '';
                }
            }
        }

        fromCampusSelect.addEventListener('change', function() {
            updateCopyIds();
            if (this.value === toCampusSelect.value && this.value !== '') {
                alert('Cơ sở xuất phát không được trùng với cơ sở nhận!');
                this.value = '';
                updateCopyIds();
            }
        });

        toCampusSelect.addEventListener('change', function() {
            if (this.value === fromCampusSelect.value && this.value !== '') {
                alert('Cơ sở nhận không được trùng với cơ sở xuất phát!');
                this.value = '';
            }
        });

        // Trigger on load
        if (campusCopiesMap && Object.keys(campusCopiesMap).length > 0) {
            let currentFrom = fromCampusSelect.value;
            // Nếu Cơ sở xuất phát hiện tại không có sách, tự động chọn cơ sở khác có sách
            if (!currentFrom || !campusCopiesMap[currentFrom] || campusCopiesMap[currentFrom].length === 0) {
                let toCampus = toCampusSelect.value;
                let availableCampuses = Object.keys(campusCopiesMap);
                // Ưu tiên chọn cơ sở có sách mà khác với Cơ sở nhận
                let bestCampus = availableCampuses.find(c => c !== toCampus) || availableCampuses[0];
                fromCampusSelect.value = bestCampus;
            }
        }

        if (fromCampusSelect.value) {
            updateCopyIds();
        }
        
        // Nếu vô tình from == to (vd người dùng chỉ định URL lỗi), cảnh báo
        if (fromCampusSelect.value === toCampusSelect.value && fromCampusSelect.value !== '') {
            alert('Cơ sở xuất phát không được trùng với cơ sở nhận. Vui lòng chọn cơ sở xuất phát khác!');
            fromCampusSelect.value = '';
            updateCopyIds();
        }
        /*]]>*/
    </script>
</body>
</html>
