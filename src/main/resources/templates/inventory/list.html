<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Browse the full book catalog of FPT University Library System."/>
    <title>Danh Mục Sách — FPT University Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            corePlugins: { preflight: false },
            theme: { extend: { colors: { fpt: { orange: '#F27125', navy: '#1E293B', dark: '#0F172A', orangeHover: '#D95F18' } } } }
        }
    </script>
    
    
    <link rel="stylesheet" th:href="@{/css/inventory-list.css}">
</head>
<body>
    

    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>

    <main class="flex-grow max-w-[1400px] mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 relative z-10 flex flex-col lg:flex-row gap-8">
        <div th:replace="~{fragments/librarian_sidebar :: sidebar('list')}"></div>

        <div class="flex-grow min-w-0">
            <!-- Page header -->
            <div class="bg-gradient-to-br from-fpt-navy via-slate-800 to-slate-900 rounded-2xl p-8 mb-8 text-white relative overflow-hidden shadow-xl">
                <div class="flex justify-between items-start relative z-10">
                    <div>
                        <h1 class="text-3xl font-extrabold mb-2 text-white">Danh Mục Sách</h1>
                        <p class="text-slate-300 text-sm">Toàn bộ tài liệu trong kho, phân theo chuyên ngành.</p>
                    </div>
                    <a href="/librarian/inventory/add"
                       class="bg-fpt-orange hover:bg-fpt-orangeHover text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-orange-500/30 transition-all flex items-center space-x-2">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                        <span>Thêm sách mới</span>
                    </a>
                </div>
                <div class="absolute top-0 right-0 w-64 h-64 bg-fpt-orange/20 rounded-full blur-3xl -mr-20 -mt-20 pointer-events-none"></div>
                <div class="absolute bottom-0 left-10 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl -mb-10 pointer-events-none"></div>
            </div>

            <!-- Books by major section -->
            <th:block th:each="section : ${majorSections}">
                <div class="flex items-center justify-between mb-4 mt-8 first:mt-0">
                    <div>
                        <h3 class="text-xl font-extrabold text-white" th:text="${section.sectionName}">Chuyên ngành</h3>
                        <p class="text-sm text-slate-400 mt-0.5">Một số tựa sách ngẫu nhiên</p>
                    </div>
                </div>
                <div th:replace="~{inventory/list :: book-grid(${section.books})}"></div>
            </th:block>
        </div>
    </main>

    <!-- ═══ BOOK GRID FRAGMENT ══════════════════════════════════════════════════ -->
    <th:block th:fragment="book-grid(books)">
        <div th:if="${books != null and !#lists.isEmpty(books)}"
             class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6 mb-4">
            <div th:each="book : ${books}"
                 class="bg-[#131c2e] rounded-2xl overflow-hidden shadow-sm card-hover flex flex-col border border-transparent hover:border-[#4f8cff]/30">
                <!-- Cover with image -->
                <div th:if="${book.coverImageUrl != null and not #strings.isEmpty(book.coverImageUrl)}"
                     class="h-40 w-full relative group overflow-hidden bg-[#0e1625] flex-shrink-0">
                    <img th:src="${book.coverImageUrl}" th:alt="${book.title}"
                         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"/>
                    <div class="absolute top-3 right-3">
                        <span class="bg-black/50 text-orange-300 text-[10px] font-bold px-2 py-0.5 rounded-full backdrop-blur-sm">FPTU</span>
                    </div>
                    <div class="absolute top-3 left-3" th:if="${book.subjectCode != null}">
                        <span class="bg-black/50 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase backdrop-blur-sm"
                              th:text="${book.subjectCode}">CODE</span>
                    </div>
                </div>
                <!-- Cover fallback -->
                <div th:unless="${book.coverImageUrl != null and not #strings.isEmpty(book.coverImageUrl)}"
                     class="h-40 w-full flex-shrink-0 bg-gradient-to-br flex flex-col justify-between p-4 text-white select-none"
                     th:classappend="${book.coverColor}">
                    <div class="flex justify-between items-start">
                        <span th:if="${book.subjectCode != null}"
                              class="bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase backdrop-blur-sm"
                              th:text="${book.subjectCode}">CODE</span>
                        <span class="text-[10px] font-bold text-orange-300 ml-auto">FPTU</span>
                    </div>
                    <h4 class="font-extrabold text-xs tracking-tight line-clamp-3 mb-1" th:text="${book.title}">Title</h4>
                    <span class="text-[10px] text-slate-300 truncate" th:text="${book.authorNames}">Author</span>
                </div>
                <!-- Card body -->
                <div class="p-4 flex flex-col flex-grow">
                    <span class="text-[10px] text-fpt-orange font-bold uppercase tracking-wider block mb-1 truncate"
                          th:text="${book.categoryName != null ? book.categoryName : (book.categoryNames != null ? book.categoryNames : '')}">Category</span>
                    <h5 class="font-bold text-white text-sm line-clamp-2 mb-1" th:text="${book.title}">Title</h5>
                    <p class=" text-xs text-white mb-2 truncate" th:text="${'Tác giả: ' + book.authorNames}">Author</p>
                    <p class="text-[11px] text-white font-mono mb-3" th:text="${'ISBN: ' + book.isbn}">ISBN</p>
                    <div class="mt-auto flex items-center justify-between pt-3 border-t border-[#1e293b]">
                        <div class="flex items-center space-x-1.5">
                            <span class="w-2 h-2 rounded-full"
                                  th:classappend="${book.availableCount > 0 ? 'bg-emerald-500' : 'bg-red-400'}"></span>
                            <span class="text-xs font-semibold"
                                  th:classappend="${book.availableCount > 0 ? 'text-emerald-400' : 'text-red-400'}"
                                  th:text="${book.availableCount > 0 ? 'Còn sách' : 'Hết sách'}">Còn sách</span>
                        </div>
                        <a th:href="@{/librarian/inventory/{id}(id=${book.bookId})}"
                           class="bg-white hover:bg-gray text-black text-xs font-bold py-1.5 px-3 rounded-lg transition-all border border-[#1e293b]">
                            Chi tiết
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${books == null or #lists.isEmpty(books)}" class="text-center py-12 text-slate-400">
            <p class="text-sm">Chưa có sách nào trong hệ thống.</p>
        </div>
    </th:block>

    
</body>
</html>
