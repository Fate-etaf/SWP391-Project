<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/header :: head('Đề nghị tài liệu mới - FPTU Library')}"></th:block>
    <style th:replace="~{fragments/footer :: footer-style}"></style>
    <style>
        /* ── CUSTOM SERVICE PAGE STYLES ── */
        .page-header { 
            background: linear-gradient(135deg, #f7f7f7 0%, #eef1f6 100%); 
            padding: 40px 20px; 
            border-bottom: 1px solid #e2e8f0; 
        }
        .page-header .inner { max-width: 1000px; margin: 0 auto; }
        .page-header h1 { font-size: 32px; color: #1a1a2e; margin-bottom: 8px; font-weight: 800; }
        .page-meta { font-size: 13px; color: #64748b; display: flex; gap: 16px; align-items: center; }
        .page-meta .badge { background: #e87722; color: #fff; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }

        .form-container { 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }
        
        .form-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #f1f5f9;
            overflow: hidden;
        }

        .form-card-header {
            background: #1a1a2e;
            color: #ffffff;
            padding: 20px 30px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        @media (max-width: 768px) {
            .form-group.full-width {
                grid-column: span 1;
            }
        }

        .form-label {
            font-size: 13.5px;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-label .required-star {
            color: #ef4444;
        }

        .form-input, .form-select, .form-textarea {
            padding: 11px 14px;
            font-size: 14.5px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #1e293b;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #e87722;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(232, 119, 34, 0.15);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-actions {
            padding: 20px 30px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14.5px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: #e87722;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #d4630f;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(232, 119, 34, 0.25);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
            color: #1e293b;
        }

        /* ── ALERTS ── */
        .alert {
            padding: 16px 20px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14.5px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.5;
        }

        .alert-success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .alert-icon {
            font-size: 18px;
            margin-top: 1px;
        }

        .section-title {
            grid-column: span 2;
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            padding-bottom: 8px;
            border-bottom: 1px solid #f1f5f9;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .section-title {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header('service')}"></div>

<div class="page-header">
    <div class="inner">
        <div class="page-meta">
            <span class="badge">Bạn đọc</span>
            <span>📍 Thư viện Đại học FPT</span>
        </div>
        <h1>Đề nghị mua tài liệu mới</h1>
    </div>
</div>

<main class="form-container">
    <!-- Notifications Area -->
    <div th:if="${successMsg}" class="alert alert-success">
        <span class="alert-icon">✅</span>
        <div th:text="${successMsg}">Yêu cầu đề nghị mua tài liệu mới thành công.</div>
    </div>
    <div th:if="${errorMsg}" class="alert alert-error">
        <span class="alert-icon">⚠️</span>
        <div th:text="${errorMsg}">Đã xảy ra lỗi khi gửi yêu cầu.</div>
    </div>

    <!-- Main Form -->
    <form th:action="@{/services/request-material}" method="post" class="form-card">
        <div class="form-card-header">
            <span>📖 Đơn đề xuất mua tài liệu thư viện</span>
        </div>
        
        <div class="form-grid">
            <div class="section-title">1. Thông tin tài liệu đề nghị</div>

            <!-- Student ID / Staff ID -->
            <div class="form-group">
                <label for="patronId" class="form-label">Mã sinh viên / Mã nhân viên</label>
                <input type="text" name="patronId" id="patronId" class="form-input" 
                       th:value="${patronId}" placeholder="Ví dụ: HE207002" autocomplete="off">
            </div>

            <!-- Title Field -->
            <div class="form-group">
                <label for="title" class="form-label">
                    Tên tài liệu / Sách <span class="required-star">*</span>
                </label>
                <input type="text" name="title" id="title" class="form-input" 
                       placeholder="Nhập tên tài liệu chi tiết..." required autocomplete="off">
            </div>

            <!-- Author Field -->
            <div class="form-group">
                <label for="author" class="form-label">
                    Tác giả <span class="required-star">*</span>
                </label>
                <input type="text" name="author" id="author" class="form-input" 
                       placeholder="Tên tác giả hoặc nhóm tác giả..." required autocomplete="off">
            </div>

            <!-- ISBN Field -->
            <div class="form-group">
                <label for="isbn" class="form-label">Mã sách (ISBN)</label>
                <input type="text" name="isbn" id="isbn" class="form-input" 
                       placeholder="Nhập mã ISBN nếu có (10 hoặc 13 số)..." autocomplete="off">
            </div>

            <!-- Publisher Field -->
            <div class="form-group">
                <label for="publisher" class="form-label">Nhà xuất bản</label>
                <input type="text" name="publisher" id="publisher" class="form-input" 
                       placeholder="Tên nhà xuất bản..." autocomplete="off">
            </div>

            <!-- Priority Field -->
            <div class="form-group">
                <label for="priority" class="form-label">
                    Thời gian cần? <span class="required-star">*</span>
                </label>
                <select name="priority" id="priority" class="form-select" required>
                    <option value="Medium" selected>25-30 ngày đối với sách Tiếng Việt, 8-12 tuần đổi với sách Ngoại văn</option>
                    <option value="Low">Không vội </option>
                    <option value="High">Gấp (yêu cầu nêu rõ lý do)</option>
                </select>
            </div>

            <!-- Language Field -->
            <div class="form-group">
                <label for="language" class="form-label">Ngôn ngữ</label>
                <input type="text" name="language" id="language" class="form-input" 
                       placeholder="Ví dụ: Tiếng Anh, Tiếng Việt..." autocomplete="off">
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email" class="form-label">
                    Email nhận phản hồi <span class="required-star">*</span>
                </label>
                <input type="email" name="email" id="email" class="form-input" 
                       th:value="${userEmail}" placeholder="Nhập địa chỉ email của bạn..." required autocomplete="off">
            </div>

            <div class="section-title">2. Chi tiết đề xuất & Liên hệ</div>

            <!-- Reason Field (Full Width) -->
            <div class="form-group full-width">
                <label for="reason" class="form-label">
                    Lý do đề xuất tài liệu <span class="required-star">*</span>
                </label>
                <textarea name="reason" id="reason" class="form-textarea" 
                          placeholder="Mô tả lý do tài liệu này cần thiết cho học tập, nghiên cứu (môn học nào, nhu cầu bản thân ra sao...)..." required></textarea>
            </div>

            <!-- Book Link -->
            <div class="form-group">
                <label for="bookLink" class="form-label">Liên kết sách</label>
                <input type="url" name="bookLink" id="bookLink" class="form-input" 
                       placeholder="Nhập liên kết đến sách nếu có..." autocomplete="off">
            </div>

            <!-- Feedback -->
            <div class="form-group">
                <label for="feedback" class="form-label">Góp ý về dịch vụ</label>
                <input type="text" name="feedback" id="feedback" class="form-input" 
                       placeholder="Nhập phản hồi nếu có..." autocomplete="off">
            </div>

        </div>

        <div class="form-actions">
            <button type="reset" class="btn btn-secondary">Nhập lại</button>
            <button type="submit" class="btn btn-primary">Gửi đề nghị mua</button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
