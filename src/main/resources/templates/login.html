<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống — FLMS FPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fpt: {
                            orange: '#F27125',
                            navy: '#1E293B',
                            dark: '#0F172A',
                            orangeHover: '#D95F18'
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0b0f19] min-h-screen text-slate-100 flex flex-col justify-center items-center relative overflow-hidden p-4">
    
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-fpt-orange/10 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-orange-500/10 rounded-full blur-[100px] pointer-events-none"></div>
    
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-fpt-orange/10 rounded-full blur-[100px] pointer-events-none">
        <a href="/home" class="text-white hover:text-fpt-orangeHover transition-colors duration-300">Quay về trang chủ</a>
    </div>
    <div class="flex items-center space-x-3 mb-8 relative z-10">
        <div class="bg-fpt-orange text-white px-3 py-1.5 rounded-xl font-extrabold text-2xl tracking-wider shadow-lg shadow-fpt-orange/20">
            FPT
        </div>
        <div>
            <h1 class="text-xl font-extrabold tracking-tight leading-none text-orange-400">FLMS</h1>
            <p class="text-[11px] text-slate-400 font-medium uppercase tracking-wider mt-0.5">Library Verification</p>
        </div>
    </div>

    <div class="w-full max-w-md bg-slate-900/60 border border-slate-800 backdrop-blur-xl rounded-2xl p-8 shadow-2xl relative z-10 transition-all hover:border-fpt-orange/30">
        
        <h2 class="text-xl font-bold text-center text-slate-200 mb-2">XÁC THỰC TÀI KHOẢN</h2>
        <p class="text-center text-xs text-slate-400 mb-6">Nhập thông tin định danh được cấp trong file Excel của trường</p>

        <div th:if="${loginError != null}" class="mb-4 bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl text-xs font-medium">
            🔒 <span th:text="${loginError}">Thông tin xác thực không chính xác hoặc chưa được import!</span>
        </div>

        <form th:action="@{/login}" method="POST" class="space-y-4">
            
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Mã số (Roll Number / User ID)</label>
                <div class="relative flex items-center">
                    <span class="absolute left-4 text-slate-500 text-sm font-bold select-none">#</span>
                    <input type="text" name="userId" th:value="${userId}" placeholder="Ví dụ: HE180000" required autocomplete="off"
                           class="w-full bg-slate-950 border border-slate-800 text-slate-200 pl-11 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:border-fpt-orange focus:ring-2 focus:ring-fpt-orange/20 transition-all placeholder-slate-650">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Địa chỉ Email</label>
                <div class="relative flex items-center">
                    <svg class="w-4 h-4 text-slate-500 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                    <input type="email" name="email" th:value="${email}" placeholder="username@fpt.edu.vn" required autocomplete="off"
                           class="w-full bg-slate-950 border border-slate-800 text-slate-200 pl-11 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:border-fpt-orange focus:ring-2 focus:ring-fpt-orange/20 transition-all placeholder-slate-650">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Cơ sở học tập (Campus)</label>
                <div class="relative flex items-center">
                    <svg class="w-4 h-4 text-slate-500 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                    </svg>
                    <select name="campusId" required class="w-full bg-slate-950 border border-slate-800 text-slate-300 pl-11 pr-4 py-3 rounded-xl text-sm focus:outline-none focus:border-fpt-orange focus:ring-2 focus:ring-fpt-orange/20 transition-all cursor-pointer appearance-none">
                        <option value="" disabled th:selected="${campusId == null}">-- Chọn cơ sở học tập --</option>
                        <option value="1" th:selected="${campusId == 1}">Hà Nội</option>
                        <option value="2" th:selected="${campusId == 2}">Đà Nẵng</option>
                        <option value="3" th:selected="${campusId == 3}">TP. Hồ Chí Minh</option>
                        <option value="4" th:selected="${campusId == 4}">Cần Thơ</option>
                        <option value="5" th:selected="${campusId == 5}">Quy Nhơn</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="w-full bg-fpt-orange hover:bg-fpt-orangeHover text-white py-3 rounded-xl font-bold transition-all text-sm shadow-lg shadow-fpt-orange/20 active:scale-[0.99] mt-4">
                Xác thực đăng nhập
            </button>
        </form>
    </div>

    <div class="text-center text-[11px] text-slate-600 mt-8 relative z-10">
        <p>&copy; 2026 FPT University Library System. Developed by Team 5 SWP391.</p>
    </div>

</body>
</html>
