<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add Book — FPT University Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg-base:       #080d17;
            --bg-surface:    #0e1625;
            --bg-card:       #131c2e;
            --border:        rgba(99, 149, 255, 0.12);
            --border-focus:  #4f8cff;
            --accent:        #4f8cff;
            --accent-hover:  #3a73df;
            --text-primary:   #e8f0ff;
            --text-secondary: #7a8fb5;
            --text-muted:     #4a5a7a;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.15);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            flex: 1;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <h1>Add New Book</h1>
        <p>Enter the details of the book below to add it to the catalog.</p>
    </div>

    <form th:action="@{/books/add}" th:object="${book}" method="post">
        
        <div class="form-group">
            <label for="title">Title <span style="color: #fb7185">*</span></label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required placeholder="E.g., Clean Code"/>
        </div>

        <div class="form-group">
            <label for="author">Author <span style="color: #fb7185">*</span></label>
            <input type="text" id="author" th:field="*{author}" class="form-control" required placeholder="E.g., Robert C.Martin"/>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" th:field="*{isbn}" class="form-control" placeholder="978-0132350884"/>
            </div>
            
            <div class="form-group">
                <label for="language">Language <span style="color: #fb7185">*</span></label>
                <input type="text" id="language" th:field="*{language}" class="form-control" required value="Vietnamese" placeholder="E.g., English"/>
            </div>
        </div>

        <div class="form-group">
            <label for="publishYear">Publish Year</label>
            <input type="number" id="publishYear" th:field="*{publishYear}" class="form-control" placeholder="2024"/>
        </div>

        <div class="form-group">
            <label for="coverImageUrl">Cover Image URL</label>
            <input type="url" id="coverImageUrl" th:field="*{coverImageUrl}" class="form-control" placeholder="https://example.com/image.jpg"/>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4" placeholder="Brief summary of the book..."></textarea>
        </div>

        <div class="btn-group">
            <a href="/books" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Book</button>
        </div>
    </form>
</div>

</body>
</html>
