<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - FPT Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .register-container { max-width: 500px; margin: 80px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-fpt { background-color: #f37021; color: white; }
        .btn-fpt:hover { background-color: #e05d15; color: white; }
        .form-title { color: #f37021; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="register-container">
        <h3 class="text-center form-title mb-4">ĐĂNG KÝ TÀI KHOẢN</h3>
        
        <form th:action="@{/register}" method="POST">
            <div class="mb-3">
                <label for="userId" class="form-label">Mã sinh viên (User ID)</label>
                <input type="text" class="form-control" id="userId" name="userId" placeholder="Ví dụ: HE123456" required>
            </div>

            <div class="mb-3">
                <label for="fullName" class="form-label">Họ và tên</label>
                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Nhập đầy đủ họ tên" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Địa chỉ Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="username@fpt.edu.vn" required>
            </div>

            <div class="mb-4">
                <label for="campusId" class="form-label">Cơ sở học tập (Campus)</label>
                <select class="form-select" id="campusId" name="campusId" required>
                    <option value="" disabled selected>-- Chọn cơ sở --</option>
                    <option value="1">Hà Nội</option>
                    <option value="2">Đà Nẵng</option>
                    <option value="3">TP. Hồ Chí Minh</option>
                    <option value="4">Cần Thơ</option>
                    <option value="5">Quy Nhơn</option>
                </select>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-fpt btn-lg">Xác nhận đăng ký</button>
                <a href="/" class="btn btn-light text-muted">Quay lại trang chủ</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
