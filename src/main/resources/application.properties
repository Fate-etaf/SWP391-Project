
spring.application.name=library-management
spring.profiles.include=local

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LMSVer2;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.type.preferred_varchar_jdbc_type=VARCHAR

# ── Mail / SMTP (Gmail) ────────────────────────────────────────────────────
# KHÔNG ĐIỀN TRỰC TIẾP mật khẩu ở đây để tránh bị lộ khi push lên GitHub.
# Sử dụng biến môi trường: GMAIL_USERNAME và GMAIL_PASSWORD.
# Nếu chạy trong IntelliJ: Edit Configurations -> Environment Variables -> Thêm GMAIL_USERNAME và GMAIL_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:YOUR_GMAIL@gmail.com}
spring.mail.password=${GMAIL_PASSWORD:YOUR_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${GMAIL_USERNAME:YOUR_GMAIL@gmail.com}

# ── UCR06 Business Rules ───────────────────────────────────────────────────
# Số đơn đặt giữ chỗ tối đa mỗi bạn đọc
app.reservation.max-active=3
# Thời gian giữ chỗ (giờ)
app.reservation.hold-hours=24
# Patron ID dùng để test (hardcoded - đổi thành HTTP Session sau)
app.reservation.test-patron-id=SE001

# ── Spring Security & OAuth2 (Google) ──────────────────────────────────────
# Lưu ý: Client ID và Client Secret được đọc từ biến môi trường.
# Bạn cần tạo credentials trên Google Cloud Console và set biến môi trường:
# GOOGLE_CLIENT_ID và GOOGLE_CLIENT_SECRET.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
