
spring.application.name=library-management

# ── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=LMSVer2;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Sa@123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── Mail / SMTP (Gmail) ────────────────────────────────────────────────────
# KHÔNG ĐIỀN TRỰC TIẾP mật khẩu ở đây để tránh bị lộ khi push lên GitHub.
# Sử dụng biến môi trường: GMAIL_USERNAME và GMAIL_PASSWORD.
# Nếu chạy trong IntelliJ: Edit Configurations -> Environment Variables -> Thêm GMAIL_USERNAME và GMAIL_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:YOUR_GMAIL@gmail.com}
spring.mail.password=${GMAIL_PASSWORD:YOUR_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${GMAIL_USERNAME:YOUR_GMAIL@gmail.com}

# ── UCR06 Business Rules ───────────────────────────────────────────────────
# Số đơn đặt giữ chỗ tối đa mỗi bạn đọc
app.reservation.max-active=3
# Thời gian giữ chỗ (giờ)
app.reservation.hold-hours=24
# Patron ID dùng để test (hardcoded - đổi thành HTTP Session sau)
app.reservation.test-patron-id=SE001


